<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3854" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#147452" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#147452" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" rx="12" fill="url(#bgGrad)" />

  <!-- Submerged Sensor Grid lines -->
  <g stroke="#1D4E72" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="40" y1="80" x2="560" y2="80" />
    <line x1="40" y1="160" x2="560" y2="160" />
    <line x1="40" y1="240" x2="560" y2="240" />
    <line x1="40" y1="320" x2="560" y2="320" />
    <line x1="120" y1="40" x2="120" y2="400" />
    <line x1="240" y1="40" x2="240" y2="400" />
    <line x1="360" y1="40" x2="360" y2="400" />
    <line x1="480" y1="40" x2="480" y2="400" />
  </g>

  <!-- Water Wave / Basin Surface -->
  <path d="M 40,240 Q 150,220 260,240 T 480,240 T 560,230 L 560,400 L 40,400 Z" fill="url(#glowGrad)" />
  <path d="M 40,240 Q 150,220 260,240 T 480,240 T 560,230" fill="none" stroke="url(#waveGrad)" stroke-width="3" />

  <!-- Edge IoT Sensing Probe Unit (Hardware Illustration) -->
  <g transform="translate(180, 100)">
    <!-- Stainless steel mount -->
    <rect x="70" y="0" width="12" height="90" fill="#94A3B8" rx="2" />
    <!-- Sensor Core Housing -->
    <rect x="50" y="80" width="52" height="130" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <rect x="58" y="92" width="36" height="30" rx="4" fill="#0F172A" />
    <!-- Indicator LEDs -->
    <circle cx="68" cy="107" r="3" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="76" cy="107" r="3" fill="#38BDF8" />
    <circle cx="84" cy="107" r="3" fill="#F59E0B" />
    <!-- Optical Spectrometer Window -->
    <rect x="62" y="140" width="28" height="40" rx="3" fill="#0EA5E9" opacity="0.8" />
    <line x1="62" y1="160" x2="90" y2="160" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <!-- Submerged Sensing Beams -->
    <path d="M 66,210 L 40,280 M 76,210 L 76,290 M 86,210 L 110,280" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="0;12" dur="1.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Telemetry Live Card Overlay (Top Right) -->
  <g transform="translate(340, 45)">
    <rect width="215" height="100" rx="8" fill="#FAF8F5" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))" />
    <rect x="14" y="14" width="8" height="8" rx="4" fill="#10B981" />
    <text x="28" y="22" font-family="monospace" font-size="10" font-weight="bold" fill="#0F3854">PILOT SITE #01 • LIVE</text>
    <text x="14" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0A2540">99.8% Sensor Uptime</text>
    <text x="14" y="62" font-family="monospace" font-size="10" fill="#5B6A78">Alert Latency: 2.8 mins (&lt; 5m)</text>
    <rect x="14" y="74" width="187" height="6" rx="3" fill="#E2DED6" />
    <rect x="14" y="74" width="168" height="6" rx="3" fill="#147452" />
  </g>

  <!-- Statutory Sandbox Badge Overlay (Bottom Left) -->
  <g transform="translate(45, 290)">
    <rect width="210" height="90" rx="8" fill="#FAF8F5" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.3))" />
    <text x="16" y="24" font-family="monospace" font-size="9" font-weight="bold" fill="#147452">DPIIT STARTUP SANDBOX</text>
    <text x="16" y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0A2540">AquaSense AI (TRL-8)</text>
    <text x="16" y="64" font-family="monospace" font-size="10" fill="#5B6A78">Optical Spectrophotometry</text>
    <text x="16" y="78" font-family="monospace" font-size="9" fill="#147452">✓ 78% Domestic Local Content</text>
  </g>

  <!-- Telemetry Trend Sparkline Overlay (Bottom Right) -->
  <g transform="translate(370, 310)">
    <rect width="185" height="70" rx="8" fill="#0F3854" stroke="#1D4E72" stroke-width="1.5" />
    <text x="14" y="20" font-family="monospace" font-size="9" fill="#94A3B8">LAB CORRELATION</text>
    <text x="14" y="38" font-family="monospace" font-size="15" font-weight="bold" fill="#34D399">98.2% Match</text>
    <path d="M 14,56 L 38,54 L 62,50 L 86,52 L 110,46 L 134,44 L 165,40" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
